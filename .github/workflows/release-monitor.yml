# Builds the Pathline Monitor download (monitor/) into one release, tag "pathlinemonitor",
# titled "Pathline Monitor <version>":
#   - Pathline-Monitor.zip: the server and the phone app it serves, for a Linux server with
#     Node.js 18 or newer (sudo sh pathline-monitor/install.sh <address>). No packages inside:
#     it has none.
#   - the same with the version in the name
# Each new version replaces the previous one's files. The release is never marked as the
# repository's "latest": that one belongs to Pathline, whose updater reads it.
#
# - Pushing to main releases automatically when monitor/package.json has a version that isn't in
#   the pathlinemonitor release yet (bump the version, push, done).
# - Actions → Release Pathline Monitor → Run workflow rebuilds the current version.
name: Release Pathline Monitor

on:
  push:
    branches: [main]
    paths: ['monitor/**', '.github/workflows/release-monitor.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./monitor/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          HAVE=$(gh release view pathlinemonitor --json assets --jq '.assets[].name' 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! echo "$HAVE" | grep -qxF "Pathline-Monitor-$V.zip"; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi
      # the oldest Node.js it supports
      - if: steps.v.outputs.build == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 18
      - if: steps.v.outputs.build == 'true'
        name: Test
        working-directory: monitor
        run: node test.js
      - if: steps.v.outputs.build == 'true'
        name: Zip and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          V: ${{ steps.v.outputs.version }}
        run: |
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "::warning::try $i failed: $*"; sleep $((i * 10)); done; return 1; }
          mkdir -p out/pathline-monitor
          cp -r monitor/server.js monitor/package.json monitor/lib monitor/app monitor/install.sh monitor/pathline-monitor.service monitor/config.example.json monitor/README.md monitor/test.js out/pathline-monitor/
          (cd out && zip -qr "Pathline-Monitor-$V.zip" pathline-monitor && cp "Pathline-Monitor-$V.zip" Pathline-Monitor.zip && rm -r pathline-monitor && ls -l)
          NOTES="Pathline Monitor $V: every Pathline Run machine's progress and queue on a phone, anywhere, with alerts. One small server that the machines report to.
          On an Amazon Linux server: unzip Pathline-Monitor.zip, then sudo sh pathline-monitor/install.sh monitor.example.com (it needs Node.js 18 or newer and no packages).
          To update, do the same with the newer zip: the password, certificate, machines, phones and alerts are kept."
          if ! gh release view pathlinemonitor > /dev/null 2>&1; then
            retry gh release create pathlinemonitor --target "$GITHUB_SHA" --title "Pathline Monitor $V" --latest=false --notes "$NOTES"
          fi
          cd out
          for f in *.zip; do retry gh release upload pathlinemonitor "$f" --clobber; done
          # drop the previous version's files
          KEEP=$(ls *.zip)
          for a in $(gh release view pathlinemonitor --json assets --jq '.assets[].name'); do
            echo "$KEEP" | grep -qxF "$a" || retry gh release delete-asset pathlinemonitor "$a" -y
          done
          retry gh release edit pathlinemonitor --title "Pathline Monitor $V" --latest=false --notes "$NOTES"
