# Builds Pathline on GitHub and publishes the installer as a GitHub release
# named after the version in package.json (tag v<version>, created by the
# release). The release includes latest.yml, which installed copies read to
# find updates. Start it from the Actions tab (Release → Run workflow), or by
# pushing a v* tag.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
