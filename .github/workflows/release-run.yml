# Builds Pathline Run (run/) like Pathline: an installer and a portable exe for
# Windows, and AppImages for the Raspberry Pi (arm64) and Linux PCs (x64). Everything
# goes into one release, tag "pathlinerun", titled "Pathline Run <version>":
#   - this version's files and the update files installed copies read (latest.yml,
#     latest-linux-arm64.yml, latest-linux.yml; the address is build.publish in run/package.json)
#   - the same downloads under fixed names, for the README links
# Each new version replaces the previous one's files. The release is never
# marked as the repository's "latest": that one belongs to Pathline, whose updater reads it.
#
# - Pushing to main releases automatically when run/package.json has a version
#   that isn't in the pathlinerun release yet (bump the version, push, done).
# - Actions → Release Pathline Run → Run workflow rebuilds the current version.
name: Release Pathline Run

on:
  push:
    branches: [main]
    paths: ['run/**', '.github/workflows/release-run.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./run/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          HAVE=$(gh release view pathlinerun --json assets --jq '.assets[].name' 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! echo "$HAVE" | grep -qxF "Pathline-Run-Setup-$V.exe"; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: run
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            run/dist/*.exe
            run/dist/*.blockmap
            run/dist/latest.yml

  linux:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: run
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx electron-builder --linux AppImage --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            run/dist/*.AppImage
            run/dist/latest-linux*.yml

  publish:
    needs: [check, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.check.outputs.version }}
        run: |
          cd files
          cp ../run/deploy/pi/install-pi.sh .
          ls -l
          NOTES="Windows: Pathline-Run-Setup.exe installs Pathline Run and keeps it up to date (or Pathline-Run-portable.exe, no install).
          Raspberry Pi: curl -fsSL https://github.com/${{ github.repository }}/releases/download/pathlinerun/install-pi.sh | bash
          Installed copies offer each new version themselves. This release always holds the newest version ($V)."
          # this version's files, the update files, and fixed names for the download links
          mkdir latest
          cp Pathline-Run-Setup-$V.exe Pathline-Run-Setup-$V.exe.blockmap Pathline-Run-$V-portable.exe Pathline-Run-$V-*.AppImage latest.yml latest-linux*.yml install-pi.sh latest/
          cp "Pathline-Run-Setup-$V.exe" latest/Pathline-Run-Setup.exe
          cp "Pathline-Run-$V-portable.exe" latest/Pathline-Run-portable.exe
          cp "Pathline-Run-$V-arm64.AppImage" latest/Pathline-Run-arm64.AppImage
          cp "Pathline-Run-$V-x86_64.AppImage" latest/Pathline-Run-x86_64.AppImage
          if ! gh release view pathlinerun > /dev/null 2>&1; then
            gh release create pathlinerun --target "$GITHUB_SHA" --title "Pathline Run $V" --latest=false --notes "$NOTES"
          fi
          gh release upload pathlinerun latest/* --clobber
          # drop the previous version's files
          KEEP=$(ls latest)
          for a in $(gh release view pathlinerun --json assets --jq '.assets[].name'); do
            echo "$KEEP" | grep -qxF "$a" || gh release delete-asset pathlinerun "$a" -y
          done
          gh release edit pathlinerun --title "Pathline Run $V" --latest=false --notes "$NOTES"
          # the earlier layout (run-latest plus one run-v… release per version) is gone
          for t in $(gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -E '^run-(latest|v[0-9])' || true); do
            gh release delete "$t" --cleanup-tag -y
          done